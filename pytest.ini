[pytest]
# Run from the repository root:  pytest
#
# rootdir must be the repo root so `backend`, `frontend` and Person 2's
# `models` package all resolve. Adding it to pythonpath means the suite works
# without an editable install.
pythonpath = .
testpaths = tests

addopts =
    -q
    --strict-markers
    --tb=short

markers =
    slow: builds a real ChromaDB index or boots the FastAPI app. Skip with -m "not slow".

filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
